<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story figures</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/00-foundation.css">
  <link rel="stylesheet" href="styles/figures.css">
  <style>
    .demo { max-width: 760px; margin: 0 auto; padding: 16px; }
    .demo section { margin: 0 0 28px; padding: 18px 16px 6px; background: var(--window-body); border: 2px outset var(--button-face); box-shadow: var(--shadow); }
    .demo h2 { margin: 0 0 12px; font-size: 22px; line-height: 1.25; }
    .demo p.lead { margin: 0 0 14px; color: var(--text-soft); }
    .demo .tall { height: 40vh; }
  </style>
</head>
<body>
  <main class="demo">
    <section>
      <h2>Where does the cost of training an AI model come from?</h2>
      <p class="lead">One GPU-hour is one GPU running for one hour.</p>
      <div data-figure="hook-gpu-hours"></div>
    </section>
    <section>
      <h2>Following one number down</h2>
      <div data-figure="cost-ladder"></div>
    </section>
    <section>
      <h2>What actually moves the bill</h2>
      <div data-figure="drivers"></div>
    </section>
    <section>
      <h2>How the chip is made, and why it barely matters here</h2>
      <div data-figure="lithography"></div>
    </section>
    <section>
      <h2>How close does it get?</h2>
      <div data-figure="accuracy"></div>
    </section>
    <section>
      <h2>Can a training run survive flaky datacenters?</h2>
      <div data-figure="flaky-sites"></div>
    </section>
    <section>
      <h2>How I built it</h2>
      <div data-figure="agents-report-card"></div>
    </section>
  </main>
  <script src="figures/index.js"></script>
  <script src="figures/hook-gpu-hours.js"></script>
  <script src="figures/cost-ladder.js"></script>
  <script src="figures/drivers.js"></script>
  <script src="figures/lithography.js"></script>
  <script src="figures/accuracy.js"></script>
  <script src="figures/flaky-sites.js"></script>
  <script src="figures/agents-report-card.js"></script>
  <script>GPUStackFigures.mountAll();</script>
</body>
</html>
