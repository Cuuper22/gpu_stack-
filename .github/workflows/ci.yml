name: CI

on:
  push:
  pull_request:

# Dependencies stay on pip. uv.lock exists, but `uv sync --locked` is not used
# here: the lock file has to be regenerated whenever pyproject.toml changes and
# nothing in CI would catch it drifting. Revisit if the lock is kept current.

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      # Rules and per-directory exceptions live in [tool.ruff] in pyproject.toml.
      - name: Lint
        run: ruff check .

  typecheck:
    name: Mypy (gpu_stack/core)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mypy and runtime dependency
        run: python -m pip install mypy sympy

      # Files and options live in [tool.mypy] in pyproject.toml.
      - name: Type-check
        run: mypy

  js:
    name: Node tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run node tests
        run: node --test tests/*.mjs

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The perf extra installs numpy so the uncertainty fast path is tested.
      - name: Install package
        run: python -m pip install -e ".[dev,perf]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run graph audit
        run: python -m gpu_stack.cli audit --fail-on-issues

      - name: Run demo
        run: python -m gpu_stack.demo

      - name: Compile source
        run: python -m compileall -q gpu_stack tests

      # The one gate of `verify --profile full` that the steps above do not
      # cover. `verify` itself is not run here because its pytest gate would
      # repeat the whole suite a second time.
      - name: Check docs stats are current
        run: python -m gpu_stack.docs_stats_check

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
