[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu_stack"
version = "0.27.0"
description = "A causal, uncertainty-aware virtual AI datacenter, visual observatory, and ML systems research lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gpu_stack contributors" },
]
keywords = [
    "gpu",
    "training",
    "sympy",
    "modeling",
    "transformer",
    "roofline",
    "cost-model",
    "virtual-datacenter",
    "causal-modeling",
    "systems-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# numpy enables the vectorized fast path in gpu_stack.uncertainty; without it
# propagation falls back to a pure-Python loop.
perf = [
    "numpy>=1.24",
]
release = [
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
gpu-stack = "gpu_stack.cli:main"

[project.urls]
Homepage = "https://github.com/cuuper22/gpu_stack-"

[tool.setuptools.packages.find]
include = ["gpu_stack*"]
exclude = ["tests*", "__pycache__", "*.__pycache__"]

[tool.setuptools.package-data]
gpu_stack = ["data/observations/literature/e001-one-step-delay/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: slowest tests (several seconds each); run by default, deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Scope modules are star-import facades: names are re-exported on purpose, so
# F401 (unused import), F403 and F405 (star-import) are expected there.
"gpu_stack/scopes/**" = ["F401", "F403", "F405"]
# Research engines hash their own source bytes into artifact identities, so
# lint autofix must not touch them.
"gpu_stack/research/**" = ["F401", "F841"]
# Fixtures imported from tests/helpers look like redefinitions to F811.
"tests/**" = ["F811"]

[tool.mypy]
python_version = "3.10"
files = ["gpu_stack/core"]
# SymPy ships no type information; treat it as Any.
ignore_missing_imports = true
